<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Bilingual (EN/PT-BR) No Man's Sky crafting, refining and cooking handbook."
    />
    <title>NMS Crafting Handbook</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-row">
        <a class="brand" href="#/" id="brand">NMS Crafting Handbook</a>
        <div class="header-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="pt">PT</button>
            <button type="button" data-lang="en">EN</button>
          </div>
          <button type="button" id="theme" class="icon-btn" aria-label="Toggle theme">◐</button>
        </div>
      </div>
      <div class="wrap">
        <input id="q" type="search" autocomplete="off" spellcheck="false" />
        <p id="source" class="muted small"></p>
      </div>
    </header>
    <main id="app" class="wrap" aria-live="polite"><p class="muted">Loading…</p></main>
    <footer class="wrap site-footer muted small" id="footer"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
